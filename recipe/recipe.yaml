schema_version: 1

context:
  name: opentelemetry-instrumentation-marqo
  version: "0.62.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_marqo-${{ version }}.tar.gz
  sha256: 56e6b007a08be1b696fb7c98c34034483c7c620a04d5f55c62f4667ff20c4e23

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constraints:
    - marqo >=3.5.1,<4.0.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - marqo
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.marqo"
      - pip check

about:
  summary: OpenTelemetry Marqo instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
